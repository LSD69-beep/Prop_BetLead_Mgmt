    var activeCompanyName = 'Sobha Limited';

    function initCompanyPage() {
      var params = new URLSearchParams(window.location.search);
      var comp = params.get('company');
      if (comp && COMPANY_PORTFOLIOS[comp]) {
        activeCompanyName = comp;

      var data = COMPANY_PORTFOLIOS[activeCompanyName];
      document.getElementById('company-name').textContent = activeCompanyName;
      document.getElementById('company-hq').textContent = data.hq;
      renderStageButtons();
      renderBuildings();
    }

    function setStage(stage) {
      activeStage = stage;
      renderStageButtons();
      renderBuildings();
    }

    function renderStageButtons() {
      document.querySelectorAll('.stage-btn').forEach(function (btn) {
        var label = btn.textContent.trim();
        if (label === activeStage) {
          btn.className = 'stage-btn px-gutter-md py-gutter-sm min-h-[40px] rounded-md bg-secondary text-on-secondary font-label text-label-md transition-colors duration-state-change cursor-pointer';

      });
    }

        return 'px-gutter-sm py-gutter-xs rounded-DEFAULT bg-success-container text-on-success-container font-mono text-mono-sm';

      if (stage === 'Under Construction') {
