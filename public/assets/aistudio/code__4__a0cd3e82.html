  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet">
  <style>
    .material-symbols-outlined {
      display: inline-block;
      width: 1em;
      height: 1em;
      line-height: 1 !important;
      box-sizing: content-box;
      overflow: hidden;

      vertical-align: middle;

<body class="bg-surface text-on-surface font-body antialiased">
  <div class="min-h-[1024px] flex flex-col bg-surface text-on-surface" data-stitch-vh="min-h-[1024px]===min-h-screen">

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-surface-container border-b border-outline-variant">
      <div class="max-w-7xl mx-auto px-gutter-lg h-20 flex items-center justify-between gap-gutter-md">
        <a href="../homepage/GlassWindowHomepage.html" class="flex items-center gap-gutter-sm shrink-0">
          <span class="w-9 h-9 rounded-DEFAULT bg-primary text-on-primary flex items-center justify-center">
            <span class="material-symbols-outlined text-title-lg" aria-hidden="true">window</span>
          </span>
          <span class="font-display text-headline-sm text-primary tracking-tight" data-design-text-token="headline-sm">GlassWindow</span>
        </a>

        <a href="../city-select/CitySelection.html" class="inline-flex items-center gap-gutter-xs px-gutter-md py-gutter-sm rounded-md bg-surface-container border border-outline-variant font-label text-label-md text-on-surface-variant hover:text-primary hover:border-primary transition-colors duration-state-change">
          <span class="material-symbols-outlined text-title-md" aria-hidden="true">arrow_back</span>
          <span data-design-text-token="label-md">Change Location</span>
        </a>
      </div>
    </header>

    <main class="flex-1 py-gutter-xl px-gutter-lg bg-surface">
      <div class="max-w-3xl mx-auto w-full flex flex-col gap-gutter-xl">

        <!-- Page Heading -->
        <div class="flex flex-col gap-gutter-xs">
          <div class="flex items-center justify-between gap-gutter-sm">
            <span class="font-body text-body-md text-on-surface-variant" data-design-text-token="body-md">Tell us about your home.</span>
            <span class="px-gutter-sm py-gutter-xs rounded-DEFAULT bg-success-container text-on-success-container font-mono text-mono-sm tabular-nums" data-design-text-token="mono-sm">2/4</span>
          </div>
          <h1 class="font-display text-display-md-mobile lg:text-display-md text-on-surface text-balance" data-design-text-token="display-md">
            Your flat preferences
          </h1>
        </div>

        <!-- Vertically Stacked 3 Steps -->
        <div class="flex flex-col gap-gutter-lg">

          <!-- Step 1: Rental or Own -->
          <section id="step-purpose" class="rounded-xl bg-surface-container border border-outline-variant p-gutter-xl shadow-sm flex flex-col gap-gutter-md">
            <div class="flex items-center justify-between gap-gutter-sm">
              <h2 class="font-headline text-headline-sm text-on-surface" data-design-text-token="headline-sm">1. Are you looking for rental or own?</h2>
              <span id="purpose-status" class="hidden px-gutter-sm py-gutter-xs rounded-full bg-success-container text-on-success-container font-label text-label-sm" data-design-text-token="label-sm">Selected</span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-gutter-md">
              <label class="purpose-btn text-left rounded-lg bg-surface-container border border-outline-variant p-gutter-lg flex items-center gap-gutter-md hover:border-primary transition-colors duration-state-change cursor-pointer">
                <input type="radio" name="purpose" value="Own" class="sr-only" onchange="selectPurpose(&#39;Own&#39;, this.closest(&#39;.purpose-btn&#39;))">
                <span class="w-11 h-11 rounded-md bg-primary-container text-on-primary-container flex items-center justify-center shrink-0">
                  <span class="material-symbols-outlined text-title-lg" aria-hidden="true">home</span>
                </span>
                <div class="flex flex-col">
                  <span class="font-title text-title-md text-on-surface" data-design-text-token="title-md">Own / Buy</span>
                  <span class="font-body text-body-sm text-on-surface-variant" data-design-text-token="body-sm">Purchase a residential flat</span>
                </div>
              </label>

              <label class="purpose-btn text-left rounded-lg bg-surface-container border border-outline-variant p-gutter-lg flex items-center gap-gutter-md hover:border-primary transition-colors duration-state-change cursor-pointer">
                <input type="radio" name="purpose" value="Rental" class="sr-only" onchange="selectPurpose(&#39;Rental&#39;, this.closest(&#39;.purpose-btn&#39;))">
                <span class="w-11 h-11 rounded-md bg-primary-container text-on-primary-container flex items-center justify-center shrink-0">
                  <span class="material-symbols-outlined text-title-lg" aria-hidden="true">key</span>
                </span>
                <div class="flex flex-col">
                  <span class="font-title text-title-md text-on-surface" data-design-text-token="title-md">Rental</span>
                  <span class="font-body text-body-sm text-on-surface-variant" data-design-text-token="body-sm">Lease a verified apartment</span>
                </div>
              </label>
            </div>
          </section>

          <!-- Step 2: How Many Bedrooms -->
          <section id="step-bedrooms" class="rounded-xl bg-surface-container border border-outline-variant p-gutter-xl shadow-sm flex flex-col gap-gutter-md transition-colors duration-surface-enter">
            <div class="flex items-center justify-between gap-gutter-sm">
              <h2 class="font-headline text-headline-sm text-on-surface" data-design-text-token="headline-sm">2. How many bedrooms do you want?</h2>
              <span id="bedroom-status" class="hidden px-gutter-sm py-gutter-xs rounded-full bg-success-container text-on-success-container font-label text-label-sm" data-design-text-token="label-sm">Selected</span>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-gutter-md">
              <button type="button" onclick="selectBedrooms(&#39;1 BHK&#39;, this)" class="bedroom-btn rounded-lg bg-surface-container border border-outline-variant p-gutter-md flex flex-col items-center justify-center gap-gutter-xs hover:border-primary transition-colors duration-state-change cursor-pointer">
                <span class="font-title text-title-lg text-on-surface tabular-nums" data-design-text-token="title-lg">1 BHK</span>
                <span class="font-body text-body-sm text-on-surface-variant" data-design-text-token="body-sm">1 Bedroom</span>
              </button>

              <button type="button" onclick="selectBedrooms(&#39;2 BHK&#39;, this)" class="bedroom-btn rounded-lg bg-surface-container border border-outline-variant p-gutter-md flex flex-col items-center justify-center gap-gutter-xs hover:border-primary transition-colors duration-state-change cursor-pointer">
                <span class="font-title text-title-lg text-on-surface tabular-nums" data-design-text-token="title-lg">2 BHK</span>
                <span class="font-body text-body-sm text-on-surface-variant" data-design-text-token="body-sm">2 Bedrooms</span>
              </button>

              <button type="button" onclick="selectBedrooms(&#39;3 BHK&#39;, this)" class="bedroom-btn rounded-lg bg-surface-container border border-outline-variant p-gutter-md flex flex-col items-center justify-center gap-gutter-xs hover:border-primary transition-colors duration-state-change cursor-pointer">
                <span class="font-title text-title-lg text-on-surface tabular-nums" data-design-text-token="title-lg">3 BHK</span>
                <span class="font-body text-body-sm text-on-surface-variant" data-design-text-token="body-sm">3 Bedrooms</span>
              </button>

              <button type="button" onclick="selectBedrooms(&#39;4+ BHK&#39;, this)" class="bedroom-btn rounded-lg bg-surface-container border border-outline-variant p-gutter-md flex flex-col items-center justify-center gap-gutter-xs hover:border-primary transition-colors duration-state-change cursor-pointer">
                <span class="font-title text-title-lg text-on-surface tabular-nums" data-design-text-token="title-lg">4+ BHK</span>
                <span class="font-body text-body-sm text-on-surface-variant" data-design-text-token="body-sm">4+ Bedrooms</span>
              </button>
            </div>
          </section>

          <!-- Step 3: Budget Range (Only 4 Options) -->
          <section id="step-budget" class="rounded-xl bg-surface-container border border-outline-variant p-gutter-xl shadow-sm flex flex-col gap-gutter-md transition-colors duration-surface-enter">
            <div class="flex items-center justify-between gap-gutter-sm">
              <h2 class="font-headline text-headline-sm text-on-surface" data-design-text-token="headline-sm">3. What is your flat budget range?</h2>
              <span id="budget-status" class="hidden px-gutter-sm py-gutter-xs rounded-full bg-success-container text-on-success-container font-label text-label-sm" data-design-text-token="label-sm">Selected</span>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-gutter-md">
              <button type="button" onclick="selectBudget(&#39;&lt; 50 Lakhs&#39;, this)" class="budget-btn rounded-lg bg-surface-container border border-outline-variant p-gutter-md flex flex-col items-center justify-center text-center hover:border-primary transition-colors duration-state-change cursor-pointer">
                <span class="font-mono text-title-md text-on-surface tabular-nums" data-design-text-token="title-md">&lt; 50 Lakhs</span>
              </button>

              <button type="button" onclick="selectBudget(&#39;50L – 1 Cr&#39;, this)" class="budget-btn rounded-lg bg-surface-container border border-outline-variant p-gutter-md flex flex-col items-center justify-center text-center hover:border-primary transition-colors duration-state-change cursor-pointer">
                <span class="font-mono text-title-md text-on-surface tabular-nums" data-design-text-token="title-md">50L – 1 Cr</span>
              </button>

              <button type="button" onclick="selectBudget(&#39;1 Cr – 2 Cr&#39;, this)" class="budget-btn rounded-lg bg-surface-container border border-outline-variant p-gutter-md flex flex-col items-center justify-center text-center hover:border-primary transition-colors duration-state-change cursor-pointer">
                <span class="font-mono text-title-md text-on-surface tabular-nums" data-design-text-token="title-md">1 Cr – 2 Cr</span>
              </button>

              <button type="button" onclick="selectBudget(&#39;&gt; 2 Cr&#39;, this)" class="budget-btn rounded-lg bg-surface-container border border-outline-variant p-gutter-md flex flex-col items-center justify-center text-center hover:border-primary transition-colors duration-state-change cursor-pointer">
                <span class="font-mono text-title-md text-on-surface tabular-nums" data-design-text-token="title-md">&gt; 2 Cr</span>
              </button>
            </div>
          </section>

        </div>

        <!-- Summary & Continue -->
        <div id="pref-feedback" class="hidden p-gutter-md rounded-lg bg-success-container text-on-success-container font-body text-body-md"></div>

        <button type="button" onclick="finishPreferences()" data-component-id="button-primary" data-component-type="button" data-component-variant="primary" class="w-full inline-flex items-center justify-center gap-gutter-sm px-gutter-lg py-gutter-sm min-h-[44px] rounded-md bg-primary text-on-primary font-label text-label-lg hover:opacity-90 transition-colors duration-state-change">
          <span data-design-text-token="label-lg">Verify Matching Flats</span>
          <span class="material-symbols-outlined text-title-md" aria-hidden="true">arrow_forward</span>
        </button>

      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-surface-container border-t border-outline-variant py-gutter-lg">
      <div class="max-w-7xl mx-auto px-gutter-lg flex flex-col sm:flex-row items-center justify-between gap-gutter-sm">
        <span class="font-body text-body-sm text-on-surface-variant" data-design-text-token="body-sm">© 2026 GlassWindow Advisory Pvt. Ltd.</span>
        <span class="font-mono text-mono-sm text-on-surface-variant" data-design-text-token="mono-sm">Home Preferences</span>
      </div>
    </footer>

  </div>

  <script>
    var chosenPurpose = '';
    var chosenBedrooms = '';
    var chosenBudget = '';

    function selectPurpose(val, el) {
      chosenPurpose = val;
      document.querySelectorAll('.purpose-btn').forEach(function (b) {
        b.classList.remove('border-primary', 'bg-primary-container/30', 'ring-1', 'ring-primary');
      });
      el.classList.add('border-primary', 'bg-primary-container/30', 'ring-1', 'ring-primary');
      document.getElementById('purpose-status').classList.remove('hidden');
      document.getElementById('step-bedrooms').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function selectBedrooms(val, el) {
      chosenBedrooms = val;
      document.querySelectorAll('.bedroom-btn').forEach(function (b) {
        b.classList.remove('border-primary', 'bg-primary-container/30', 'ring-1', 'ring-primary');
      });
      el.classList.add('border-primary', 'bg-primary-container/30', 'ring-1', 'ring-primary');
      document.getElementById('bedroom-status').classList.remove('hidden');
      document.getElementById('step-budget').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function selectBudget(val, el) {
      chosenBudget = val;
      document.querySelectorAll('.budget-btn').forEach(function (b) {
        b.classList.remove('border-primary', 'bg-primary-container/30', 'ring-1', 'ring-primary');
      });
      el.classList.add('border-primary', 'bg-primary-container/30', 'ring-1', 'ring-primary');
      document.getElementById('budget-status').classList.remove('hidden');
    }

    function finishPreferences() {
      var feedback = document.getElementById('pref-feedback');
      if (!chosenPurpose || !chosenBedrooms || !chosenBudget) {
        feedback.textContent = 'Please select Rental/Own, Bedrooms, and Budget Range to continue.';
        feedback.classList.remove('hidden');
        return;
      }
      try {
        localStorage.setItem('gw_purpose', chosenPurpose);
        localStorage.setItem('gw_bedrooms', chosenBedrooms);
        localStorage.setItem('gw_budget', chosenBudget);
      } catch (e) {}
      var params = new URLSearchParams({
        purpose: chosenPurpose,
        bedrooms: chosenBedrooms,
        budget: chosenBudget
      });
      window.location.href = '../listings/MatchingFlats.html?' + params.toString();
    }
  </script>


</body></html>
