<body class="bg-surface text-on-surface font-body antialiased">
  <div class="min-h-[1024px] flex flex-col bg-surface text-on-surface" data-stitch-vh="min-h-[1024px]===min-h-screen">

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-surface-container/90 backdrop-blur-md border-b border-outline-variant">
      <div class="max-w-7xl mx-auto px-gutter-lg h-20 flex items-center justify-between gap-gutter-md">
        <a href="../homepage/GlassWindowHomepage.html" class="flex items-center gap-gutter-sm shrink-0 group">
          <span class="w-9 h-9 rounded-DEFAULT bg-primary text-on-primary flex items-center justify-center transition-transform duration-state-change group-hover:scale-105">
            <span class="material-symbols-outlined text-title-lg" aria-hidden="true">window</span>
          </span>
          <span class="font-display text-headline-sm text-primary tracking-tight" data-design-text-token="headline-sm">GlassWindow</span>
        </a>

        <a href="../homepage/GlassWindowHomepage.html" class="inline-flex items-center gap-gutter-xs px-gutter-md py-gutter-sm rounded-md bg-surface-container border border-outline-variant font-label text-label-md text-on-surface-variant hover:text-primary hover:border-primary transition-colors duration-state-change">
          <span class="material-symbols-outlined text-title-md" aria-hidden="true">arrow_back</span>
          <span data-design-text-token="label-md">All Profiles</span>
        </a>
      </div>
    </header>

    <main class="relative flex-1 flex items-center justify-center py-section overflow-hidden bg-surface">

      <!-- Cross-Fading House Background Slideshow -->

        <img src="https://lh3.googleusercontent.com/aida/ALJJyrAlEwoqWO9QoNGiY5iOZY1fyczDC6s3upnEqebfdtDcq-9ImgDeFFPIc3Nh6bsEHQ3FzMaIFiHTS3lReeEzMryRZpQGBcTngG3v7c2bKaheKGy31gZtZa9rt3z6qtf2ZBjPermvREevjuVlclTNPKAVOReS1aSb2ioeavO4qPmuoL7Y9eIFBzwWJGb9mYwLFLEvhvXUKpRxpBuIUctqfEeyxXbETziF9X5UQ6zyELzMv971j6F81VDj-r0oZ95HOQ" alt class="bg-slide absolute inset-0 w-full h-full object-cover opacity-0 transition-opacity duration-1000 ease-out">
        <img src="https://lh3.googleusercontent.com/aida/ALJJyrCpyR9bbKmH4qhsh4jyeUFaKbiaEbn_AxPeC9P1otiiBv7rNf0w9SrcZSaNPNogPQPat8QUbyc8PWgnZydFGkvFn_xS6PbyY6SZi-JZmZ4uMAzziY6KceJq65Nur-6XU068LVcjXLCtMzV98B9YLlJwE5sMu1QDp_93qP9YZPiMRPm4XaXytQBwfTOwJRd5fGYd8mVO6lSD3KNq-tzo9K3_xDdZxA2ciJXbl11dq9zGQbxXYKnRAcCoRTJcRmqNwg" alt class="bg-slide absolute inset-0 w-full h-full object-cover opacity-0 transition-opacity duration-1000 ease-out">
        <div class="absolute inset-0 bg-surface/45"></div>
      </div>

      <!-- Frosted Glass Customer Auth Card -->
      <section class="relative z-10 w-full max-w-md px-gutter-lg animate-glass-enter">
        <div class="rounded-xl bg-surface-container/85 backdrop-blur-md border border-outline-variant p-gutter-xl shadow-lg flex flex-col gap-gutter-lg">
          <div class="flex items-center justify-between gap-gutter-sm">
            <div class="w-11 h-11 rounded-md bg-primary-container text-on-primary-container flex items-center justify-center">
              <span class="material-symbols-outlined text-headline-sm" aria-hidden="true">person</span>
            </div>
            <span class="px-gutter-sm py-gutter-xs rounded-full bg-primary-container text-on-primary-container font-label text-label-sm" data-design-text-token="label-sm">Customer Portal</span>
          </div>

          <!-- Sign In / Sign Up Switcher -->
          <div data-component-id="tabs-horizontal" data-component-type="tabs" data-component-variant="horizontal">
            <div role="tablist" aria-label="Customer authentication mode" class="grid grid-cols-2 p-gutter-xs rounded-md bg-surface-container-low border border-outline-variant gap-gutter-xs">
              <button type="button" role="tab" id="tab-signin" aria-selected="true" onclick="setAuthMode(&#39;signin&#39;)" class="px-gutter-md py-gutter-sm rounded-DEFAULT bg-surface-container text-primary shadow-sm font-label text-label-md transition-colors duration-state-change">
                <span data-design-text-token="label-md">Sign In</span>
              </button>
              <button type="button" role="tab" id="tab-signup" aria-selected="false" onclick="setAuthMode(&#39;signup&#39;)" class="px-gutter-md py-gutter-sm rounded-DEFAULT text-on-surface-variant hover:text-on-surface font-label text-label-md transition-colors duration-state-change">
                <span data-design-text-token="label-md">Sign Up</span>
              </button>
            </div>
          </div>

          <div class="flex flex-col gap-gutter-xs">
            <h1 id="auth-heading" class="font-display text-headline-lg-mobile lg:text-headline-md text-on-surface" data-design-text-token="headline-md">Customer Login</h1>
            <p id="auth-subtext" class="font-body text-body-md text-on-surface-variant" data-design-text-token="body-md">
              Sign in with your username and password to view your shortlisted homes.
            </p>
          </div>

          <form onsubmit="handleCustomerSubmit(event)" class="flex flex-col gap-gutter-md">
            <!-- Sign Up Only Fields -->
            <div id="signup-fields" class="hidden flex flex-col gap-gutter-md">
              <label data-component-id="input-field-signup-text" data-component-type="input-field" data-component-variant="text" class="flex flex-col gap-gutter-xs">
                <span class="font-label text-label-md text-on-surface" data-design-text-token="label-md">Full name</span>
                <input id="customer-fullname" type="text" placeholder="Enter your full name" class="w-full min-h-[44px] px-gutter-md py-gutter-sm rounded-DEFAULT bg-surface-container border border-outline-variant text-on-surface font-body text-body-md placeholder:text-outline focus:border-primary focus:ring-1 focus:ring-primary transition-colors duration-state-change">
              </label>

              <label data-component-id="input-field-signup-icon" data-component-type="input-field" data-component-variant="with-icon" class="flex flex-col gap-gutter-xs">
                <span class="font-label text-label-md text-on-surface" data-design-text-token="label-md">Email address</span>
                <div class="relative flex items-center">
                  <span aria-hidden="true" class="material-symbols-outlined text-title-lg text-on-surface-variant absolute left-3 pointer-events-none">mail</span>
                  <input id="customer-email" type="email" placeholder="you@example.com" class="w-full min-h-[44px] pl-10 pr-gutter-md py-gutter-sm rounded-DEFAULT bg-surface-container border border-outline-variant text-on-surface font-body text-body-md placeholder:text-outline focus:border-primary focus:ring-1 focus:ring-primary transition-colors duration-state-change">
                </div>
              </label>
            </div>

            <label data-component-id="input-field-icon" data-component-type="input-field" data-component-variant="with-icon" class="flex flex-col gap-gutter-xs">
              <span class="font-label text-label-md text-on-surface" data-design-text-token="label-md">Username</span>
              <div class="relative flex items-center">
                <span aria-hidden="true" class="material-symbols-outlined text-title-lg text-on-surface-variant absolute left-3 pointer-events-none">person</span>
                <input id="customer-username" type="text" required autocomplete="username" placeholder="Enter your username" class="w-full min-h-[44px] pl-10 pr-gutter-md py-gutter-sm rounded-DEFAULT bg-surface-container border border-outline-variant text-on-surface font-body text-body-md placeholder:text-outline focus:border-primary focus:ring-1 focus:ring-primary transition-colors duration-state-change">
              </div>
            </label>

            <label data-component-id="input-field-text" data-component-type="input-field" data-component-variant="password" class="flex flex-col gap-gutter-xs">
              <span class="font-label text-label-md text-on-surface" data-design-text-token="label-md">Password</span>
              <div class="relative flex items-center">
                <input id="customer-password" type="password" required autocomplete="current-password" placeholder="Enter your password" class="w-full min-h-[44px] pl-gutter-md pr-10 py-gutter-sm rounded-DEFAULT bg-surface-container border border-outline-variant text-on-surface font-body text-body-md placeholder:text-outline focus:border-primary focus:ring-1 focus:ring-primary transition-colors duration-state-change">
                <button type="button" onclick="togglePassword(&#39;customer-password&#39;, &#39;customer-eye&#39;)" aria-label="Toggle password visibility" class="absolute right-3 text-on-surface-variant hover:text-on-surface transition-colors duration-state-change">
                  <span id="customer-eye" class="material-symbols-outlined text-title-lg" aria-hidden="true">visibility</span>
                </button>
              </div>
            </label>

            <div id="customer-feedback" class="hidden p-gutter-sm rounded-DEFAULT bg-success-container text-on-success-container font-body text-body-sm"></div>

            <button id="customer-submit-btn" type="submit" data-component-id="button-primary" data-component-type="button" data-component-variant="primary" class="w-full inline-flex items-center justify-center gap-gutter-sm px-gutter-lg py-gutter-sm min-h-[44px] rounded-md bg-primary text-on-primary font-label text-label-lg hover:opacity-90 active:scale-[0.99] transition-all duration-state-change">
              <span data-design-text-token="label-lg">Sign in to Customer Portal</span>
            </button>
          </form>
        </div>
      </section>

    </main>

    <!-- Footer -->
    <footer class="relative z-10 bg-surface-container/90 backdrop-blur-md border-t border-outline-variant py-gutter-lg">
      <div class="max-w-7xl mx-auto px-gutter-lg flex flex-col sm:flex-row items-center justify-between gap-gutter-sm">
        <span class="font-body text-body-sm text-on-surface-variant" data-design-text-token="body-sm">© 2026 GlassWindow Advisory Pvt. Ltd.</span>
        <span class="font-mono text-mono-sm text-on-surface-variant" data-design-text-token="mono-sm">Customer Portal</span>
      </div>
    </footer>

  </div>

  <script>
    var authMode = 'signin';
    var slideIndex = 0;

    setInterval(function () {
      var slides = document.querySelectorAll('.bg-slide');
      if (!slides.length) return;
      slides[slideIndex].classList.remove('opacity-100');
      slides[slideIndex].classList.add('opacity-0');
      slideIndex = (slideIndex + 1) % slides.length;
      slides[slideIndex].classList.remove('opacity-0');
      slides[slideIndex].classList.add('opacity-100');
    }, 4500);

    function setAuthMode(mode) {
      authMode = mode;
      var tabIn = document.getElementById('tab-signin');
      var tabUp = document.getElementById('tab-signup');
      var signupFields = document.getElementById('signup-fields');
      var heading = document.getElementById('auth-heading');
      var subtext = document.getElementById('auth-subtext');
      var submitBtn = document.getElementById('customer-submit-btn');
      var fullname = document.getElementById('customer-fullname');
      var email = document.getElementById('customer-email');

      if (mode === 'signup') {
        tabUp.setAttribute('aria-selected', 'true');
        tabUp.className = 'px-gutter-md py-gutter-sm rounded-DEFAULT bg-surface-container text-primary shadow-sm font-label text-label-md transition-colors duration-state-change';
        tabIn.setAttribute('aria-selected', 'false');
        tabIn.className = 'px-gutter-md py-gutter-sm rounded-DEFAULT text-on-surface-variant hover:text-on-surface font-label text-label-md transition-colors duration-state-change';
        signupFields.classList.remove('hidden');
        fullname.required = true;
        email.required = true;
        heading.textContent = 'Create Customer Account';
        subtext.textContent = 'Sign up to explore verified flats across Hyderabad, Bangalore, and Delhi.';
        submitBtn.querySelector('span').textContent = 'Create Customer Account';
      } else {
        tabIn.setAttribute('aria-selected', 'true');
        tabIn.className = 'px-gutter-md py-gutter-sm rounded-DEFAULT bg-surface-container text-primary shadow-sm font-label text-label-md transition-colors duration-state-change';
        tabUp.setAttribute('aria-selected', 'false');
        tabUp.className = 'px-gutter-md py-gutter-sm rounded-DEFAULT text-on-surface-variant hover:text-on-surface font-label text-label-md transition-colors duration-state-change';
        signupFields.classList.add('hidden');
        fullname.required = false;
        email.required = false;
        heading.textContent = 'Customer Login';
        subtext.textContent = 'Sign in with your username and password to view your shortlisted homes.';
        submitBtn.querySelector('span').textContent = 'Sign in to Customer Portal';
      }
    }

    function togglePassword(inputId, iconId) {
      var input = document.getElementById(inputId);
      var icon = document.getElementById(iconId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = 'visibility_off';
      } else {
        input.type = 'password';
        icon.textContent = 'visibility';
      }
    }

    function handleCustomerSubmit(event) {
      event.preventDefault();
      var username = document.getElementById('customer-username').value;
      var feedback = document.getElementById('customer-feedback');
      feedback.textContent = (authMode === 'signup' ? 'Account created for ' : 'Welcome back, ') + username + '. Redirecting to city selection...';
      feedback.classList.remove('hidden');
      setTimeout(function () {
        window.location.href = '../city-select/CitySelection.html';
      }, 650);
    }
  </script>
