    var activeCity = 'Bangalore';

    function initFromState() {
      var params = new URLSearchParams(window.location.search);
      var purpose = params.get('purpose') || '';
      var bedrooms = params.get('bedrooms') || '';
      var budget = params.get('budget') || '';

      try {
        if (!purpose) purpose = localStorage.getItem('gw_purpose') || 'Own / Buy';
        if (!bedrooms) bedrooms = localStorage.getItem('gw_bedrooms') || '3 BHK';
        if (!budget) budget = localStorage.getItem('gw_budget') || '1 Cr – 2 Cr';
        var savedCity = localStorage.getItem('gw_city');
        if (savedCity && FLATS_BY_CITY[savedCity]) {
          activeCity = savedCity;
        }
      } catch (e) {
        if (!purpose) purpose = 'Own / Buy';
        if (!bedrooms) bedrooms = '3 BHK';
        if (!budget) budget = '1 Cr – 2 Cr';
      }

      document.getElementById('region-summary').textContent = activeCity + ' Region';
      document.getElementById('prefs-summary').textContent =
        'Showing verified flats for ' + purpose + ' • ' + bedrooms + ' • ' + budget;
      renderFlats();
    }

    function toggleStockPanel() {
      var drawer = document.getElementById('stock-drawer');
      drawer.classList.toggle('hidden');
    }
